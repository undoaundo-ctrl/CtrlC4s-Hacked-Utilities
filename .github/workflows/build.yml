name: Build CtrlC4's Hacked Utilities

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build -Pbuild_number=${{ github.run_number }}
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: CtrlC4s-Hacked-Utilities
          path: build/libs/*.jar
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CtrlC4's Hacked Utilities build ${{ github.run_number }}
          files: build/libs/CtrlC4s-Hacked-Utilities-*[0-9].jar
